services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/timetable.sqlite3
    volumes:
      - timetable-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
volumes:
  timetable-data:
